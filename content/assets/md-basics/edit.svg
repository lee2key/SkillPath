<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img"><title>Меняйте форму, а не положение</title><desc>Transform Pattern двигает всю деталь</desc><rect width="960" height="560" rx="20" fill="#f3f7f8"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="88" rx="0" fill="#243746" stroke="#243746" stroke-width="3"/><text x="34" y="55" font-size="30" fill="#fff" text-anchor="start">Меняйте форму, а не положение</text><polygon points="90,185 310,185 350,405 50,405" fill="#d7efed" stroke="#117f83" stroke-width="4"/><polygon points="600,185 820,185 900,405 560,405" fill="#d7efed" stroke="#117f83" stroke-width="4"/><circle cx="350" cy="405" r="7" fill="#d77b24"/><circle cx="900" cy="405" r="7" fill="#d77b24"/><path d="M390,290 L520,290" fill="none" stroke="#243746" stroke-width="4"/><path d="M510,283 L520,290 L510,297" fill="none" stroke="#243746" stroke-width="3"/><text x="205" y="455" font-size="26" fill="#243746" text-anchor="middle">До</text><text x="740" y="455" font-size="25" fill="#243746" text-anchor="middle">После: угол наружу</text><text x="480" y="135" font-size="25" fill="#243746" text-anchor="middle">Edit Pattern → точка → небольшое перемещение</text><path d="M30,495 L930,495" fill="none" stroke="#d3dfe4" stroke-width="4"/><text x="32" y="532" font-size="20" fill="#243746" text-anchor="start">Учебная схема · Transform Pattern двигает всю деталь</text></g></svg>