<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img"><title>Связанная зеркальная пара</title><desc>Перед и спинка не обязаны быть зеркальными</desc><rect width="960" height="560" rx="20" fill="#f3f7f8"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="88" rx="0" fill="#243746" stroke="#243746" stroke-width="3"/><text x="34" y="55" font-size="30" fill="#fff" text-anchor="start">Связанная зеркальная пара</text><polygon points="80,195 315,195 345,390 50,390" fill="#d7efed" stroke="#117f83" stroke-width="4"/><polygon points="610,195 845,195 875,390 580,390" fill="#d7efed" stroke="#117f83" stroke-width="4"/><path d="M465,150 L465,425" fill="none" stroke="#90a4af" stroke-width="4" stroke-dasharray="10 8"/><circle cx="80" cy="195" r="7" fill="#d77b24"/><circle cx="845" cy="195" r="7" fill="#d77b24"/><text x="465" y="465" font-size="24" fill="#243746" text-anchor="middle">Изменение одной стороны отражается на другой</text><text x="465" y="135" font-size="28" fill="#117f83" text-anchor="middle">Symmetric Pattern (with Sewing)</text><path d="M30,495 L930,495" fill="none" stroke="#d3dfe4" stroke-width="4"/><text x="32" y="532" font-size="20" fill="#243746" text-anchor="start">Учебная схема · Перед и спинка не обязаны быть зеркальными</text></g></svg>