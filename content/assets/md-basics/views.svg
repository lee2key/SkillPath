<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img"><title>Три ракурса для проверки</title><desc>Проверяйте одежду со всех сторон</desc><rect width="960" height="560" rx="20" fill="#f3f7f8"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="88" rx="0" fill="#243746" stroke="#243746" stroke-width="3"/><text x="34" y="55" font-size="30" fill="#fff" text-anchor="start">Три ракурса для проверки</text><rect x="80" y="135" width="230" height="300" rx="8" fill="#fff" stroke="#d3dfe4" stroke-width="3"/><text x="195" y="180" font-size="28" fill="#117f83" text-anchor="middle">Front</text><polygon points="160,225 230,225 255,345 135,345" fill="#d7efed" stroke="#117f83" stroke-width="4"/><text x="195" y="400" font-size="22" fill="#243746" text-anchor="middle">Симметрия</text><rect x="365" y="135" width="230" height="300" rx="8" fill="#fff" stroke="#d3dfe4" stroke-width="3"/><text x="480" y="180" font-size="28" fill="#117f83" text-anchor="middle">Side</text><polygon points="445,225 515,225 540,345 420,345" fill="#d7efed" stroke="#117f83" stroke-width="4"/><text x="480" y="400" font-size="22" fill="#243746" text-anchor="middle">Зазор</text><rect x="650" y="135" width="230" height="300" rx="8" fill="#fff" stroke="#d3dfe4" stroke-width="3"/><text x="765" y="180" font-size="28" fill="#117f83" text-anchor="middle">Back</text><polygon points="730,225 800,225 825,345 705,345" fill="#d7efed" stroke="#117f83" stroke-width="4"/><text x="765" y="400" font-size="22" fill="#243746" text-anchor="middle">Задняя сторона</text><text x="480" y="475" font-size="25" fill="#243746" text-anchor="middle">Камера двигается — лекало не меняется</text><path d="M30,495 L930,495" fill="none" stroke="#d3dfe4" stroke-width="4"/><text x="32" y="532" font-size="20" fill="#243746" text-anchor="start">Учебная схема · Проверяйте одежду со всех сторон</text></g></svg>