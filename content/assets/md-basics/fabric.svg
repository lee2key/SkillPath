<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img"><title>У Fabric есть вид и физика</title><desc>Для честного сравнения меняйте один параметр</desc><rect width="960" height="560" rx="20" fill="#f3f7f8"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="88" rx="0" fill="#243746" stroke="#243746" stroke-width="3"/><text x="34" y="55" font-size="30" fill="#fff" text-anchor="start">У Fabric есть вид и физика</text><rect x="55" y="155" width="390" height="280" rx="8" fill="#fff" stroke="#becdd4" stroke-width="3"/><rect x="515" y="155" width="390" height="280" rx="8" fill="#fff" stroke="#becdd4" stroke-width="3"/><text x="250" y="210" font-size="28" fill="#117f83" text-anchor="middle">Color / Texture</text><text x="710" y="210" font-size="28" fill="#117f83" text-anchor="middle">Physical Property</text><circle cx="180" cy="290" r="32" fill="#3e83b6"/><circle cx="320" cy="290" r="32" fill="#d77b24"/><text x="250" y="385" font-size="27" fill="#243746" text-anchor="middle">Внешний вид</text><text x="710" y="285" font-size="25" fill="#243746" text-anchor="middle">Stretch · Bending</text><text x="710" y="385" font-size="27" fill="#243746" text-anchor="middle">Поведение ткани</text><path d="M30,495 L930,495" fill="none" stroke="#d3dfe4" stroke-width="4"/><text x="32" y="532" font-size="20" fill="#243746" text-anchor="start">Учебная схема · Для честного сравнения меняйте один параметр</text></g></svg>