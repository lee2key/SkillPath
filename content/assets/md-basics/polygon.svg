<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img"><title>Polygon: четыре точки — одна деталь</title><desc>Контур не должен пересекать сам себя</desc><rect width="960" height="560" rx="20" fill="#f3f7f8"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="88" rx="0" fill="#243746" stroke="#243746" stroke-width="3"/><text x="34" y="55" font-size="30" fill="#fff" text-anchor="start">Polygon: четыре точки — одна деталь</text><polygon points="300,200 660,200 745,420 215,420" fill="#d7efed" stroke="#117f83" stroke-width="4"/><circle cx="300" cy="200" r="7" fill="#d77b24"/><text x="315" y="185" font-size="24" fill="#d77b24" text-anchor="start">1</text><circle cx="660" cy="200" r="7" fill="#d77b24"/><text x="675" y="185" font-size="24" fill="#d77b24" text-anchor="start">2</text><circle cx="745" cy="420" r="7" fill="#d77b24"/><text x="760" y="405" font-size="24" fill="#d77b24" text-anchor="start">3</text><circle cx="215" cy="420" r="7" fill="#d77b24"/><text x="230" y="405" font-size="24" fill="#d77b24" text-anchor="start">4</text><text x="480" y="165" font-size="27" fill="#243746" text-anchor="middle">Верх уже низа</text><text x="480" y="465" font-size="25" fill="#243746" text-anchor="middle">Замкните контур: 1 → 2 → 3 → 4 → 1</text><path d="M30,495 L930,495" fill="none" stroke="#d3dfe4" stroke-width="4"/><text x="32" y="532" font-size="20" fill="#243746" text-anchor="start">Учебная схема · Контур не должен пересекать сам себя</text></g></svg>