<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img"><title>Segment Sewing: проверьте направление</title><desc>Здесь показана одна пара боковых краёв</desc><rect width="960" height="560" rx="20" fill="#f3f7f8"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="960" height="88" rx="0" fill="#243746" stroke="#243746" stroke-width="3"/><text x="34" y="55" font-size="30" fill="#fff" text-anchor="start">Segment Sewing: проверьте направление</text><rect x="75" y="195" width="235" height="225" rx="8" fill="#d7efed" stroke="#117f83" stroke-width="3"/><rect x="620" y="195" width="235" height="225" rx="8" fill="#d7efed" stroke="#117f83" stroke-width="3"/><text x="185" y="160" font-size="27" fill="#117f83" text-anchor="middle">Перед</text><text x="735" y="160" font-size="27" fill="#117f83" text-anchor="middle">Спинка</text><path d="M310,195 L620,195" fill="none" stroke="#d77b24" stroke-width="4" stroke-dasharray="10 8"/><path d="M310,420 L620,420" fill="none" stroke="#d77b24" stroke-width="4" stroke-dasharray="10 8"/><text x="465" y="260" font-size="25" fill="#243746" text-anchor="middle">Верх ↔ верх</text><text x="465" y="355" font-size="25" fill="#243746" text-anchor="middle">Низ ↔ низ</text><text x="465" y="465" font-size="23" fill="#243746" text-anchor="middle">Соединяем соответствующие боковые края</text><path d="M30,495 L930,495" fill="none" stroke="#d3dfe4" stroke-width="4"/><text x="32" y="532" font-size="20" fill="#243746" text-anchor="start">Учебная схема · Здесь показана одна пара боковых краёв</text></g></svg>