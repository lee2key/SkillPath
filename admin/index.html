<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillPath — редактор</title><link rel="stylesheet" href="/admin.css"></head><body><header><b>SkillPath <small>Редактор курсов</small></b><span id="status"></span><button id="checkResources">Проверить файлы</button><button id="save">Сохранить</button><button id="build" class="dark">Создать release</button></header><div class="layout"><aside class="lesson-sidebar"><div class="add-course-items"><button id="addLesson">＋ Урок</button><button id="addSeparator">＋ Разделитель</button></div><div id="lessons"></div></aside><main id="editor"></main><aside class="course-sidebar" aria-label="Настройки курса"><div class="course-sidebar-inner"><h2>Настройки курса</h2><label class="field">Выбор курса<select id="courseSelect" title="Текущий курс"></select></label><div class="course-buttons"><button id="newCourse">＋ Новый курс</button><button id="deleteCourse" class="danger">Удалить</button></div><div id="courseSettings"></div></div></aside></div><dialog id="resourceDialog" aria-labelledby="resourceTitle"><div class="resource-heading"><h2 id="resourceTitle">Ресурсы курсов</h2><button type="button" onclick="document.querySelector('#resourceDialog').close()" aria-label="Закрыть">×</button></div><div id="resourceReport"></div><div class="resource-actions"><button type="button" id="cleanResources" class="danger" disabled>Очистить неиспользуемые</button><button type="button" onclick="document.querySelector('#resourceDialog').close()">Закрыть</button></div></dialog><script src="/admin.js"></script></body></html>
